name: musl-static-build
on:
  push:
    branches: [qeflow-rust, main]
  pull_request:
    branches: [qeflow-rust, main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            scripts/linux/.sources
          key: musl-sources-${{ hashFiles('Cargo.lock', 'scripts/linux/Dockerfile') }}
      - name: Build, test, verify static ELF and run offline
        run: bash scripts/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dftflow-linux-x86_64-musl
          path: dist/dftflow-linux-x86_64-musl.tar.gz
          if-no-files-found: error
