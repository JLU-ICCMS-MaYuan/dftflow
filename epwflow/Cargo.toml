[package]
name = "epwflow"
version = "0.1.0"
edition = "2021"
autobins = false
description = "受控的 QE/EPW 超导计算工作流"

[[bin]]
name = "epw_phonon"
path = "src/bin/epw_phonon.rs"

[[bin]]
name = "epw_wannier"
path = "src/bin/epw_wannier.rs"

[[bin]]
name = "epw_superconductivity"
path = "src/bin/epw_superconductivity.rs"

[dependencies]
qeflow = { path = "../qeflow" }
qf-phonon = { path = "../crates/qf-phonon" }
qf-wannier = { path = "../crates/qf-wannier" }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
toml = { workspace = true }
regex = { workspace = true }
roxmltree = { workspace = true }
sha2 = "0.10"
libc = "0.2"
qf-config = { path = "../crates/qf-config" }
qf-crystal = { path = "../crates/qf-crystal" }
qf-input = { path = "../crates/qf-input" }
qf-io = { path = "../crates/qf-io" }
plotters = { workspace = true }
svg2pdf = { workspace = true }
