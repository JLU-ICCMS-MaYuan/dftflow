# 版本 2：各阶段独立设置；不兼容旧版。
# 科学参数保留原生名称和单位；workflow 单独记录执行与推导规则。
work_dir = "run"
structure = "POSCAR"
schema_version = 2
outdir = "scratch"

[pseudos]
Mg = "Mg.upf"
B = "B.upf"

[programs]
launcher = [ "./launcher", "-np", "1",]

[programs.pw]
path = "./pw.x"
args = []

[programs.ph]
path = "./ph.x"
args = []

[programs.epw]
path = "./epw.x"
args = []

[resources]
partition = "test"
nodes = 1
mpi = 1

[budget]
campaign_id = "epic-0007"
ledger = "campaign/ledger.json"

[stages]

[stages."1.qe-scf"]

[stages."1.qe-scf".pw]
K_POINTS = '''automatic
4 4 2 0 0 0'''
ATOMIC_SPECIES = '''Mg 24.305 Mg.upf
B 10.811 B.upf'''

[stages."1.qe-scf".pw.CONTROL]
calculation = "scf"
prefix = "MgB2"

[stages."1.qe-scf".pw.SYSTEM]
# ecutwfc、ecutrho、degauss：Ry。
ecutwfc = 40.0
ecutrho = 320.0
occupations = "smearing"
smearing = "mv"
degauss = 0.02

[stages."1.qe-scf".pw.ELECTRONS]
# conv_thr：Ry；mixing_beta 为无量纲。
conv_thr = 1e-10

[stages."1.qe-scf".workflow]

[stages."1.qe-scf".workflow.derived]
"pw.CONTROL.outdir" = "当前阶段工作目录和已绑定赝势源"
