# 版本 2：各阶段独立设置；不兼容旧版。
# 科学参数保留原生名称和单位；workflow 独立记录执行设置；自动绑定由程序内部确认。
work_dir = "run"
structure = "POSCAR"
schema_version = 2
outdir = "scratch"

[pseudos]
Mg = "Mg.upf"
B = "B.upf"

[programs]
launcher = [ "./launcher", "-np", "1",]

[programs.pw]
path = "./pw.x"
args = []

[programs.ph]
path = "./ph.x"
args = []

[programs.epw]
path = "./epw.x"
args = []


[slurm]
header = """
#SBATCH --partition=test
#SBATCH --nodes=1
#SBATCH --ntasks=1
"""

[budget]
campaign_id = "epic-0007"
ledger = "campaign/ledger.json"


[stages."1.qe-scf"]
K_POINTS = '''automatic
4 4 2 0 0 0'''
ATOMIC_SPECIES = '''Mg 24.305 Mg.upf
B 10.811 B.upf'''

calculation = "scf"
prefix = "MgB2"

# ecutwfc、ecutrho、degauss：Ry。
ecutwfc = 40.0
ecutrho = 320.0
occupations = "smearing"
smearing = "mv"
degauss = 0.02

# conv_thr：Ry；mixing_beta 为无量纲。
conv_thr = 1e-10

[stages."2.qe-nscf"]
K_POINTS = [4, 4, 2]
ATOMIC_SPECIES = '''Mg 24.305 Mg.upf
B 10.811 B.upf'''

calculation = "nscf"
prefix = "MgB2"

# ecutwfc、ecutrho、degauss：Ry。
ecutwfc = 40.0
ecutrho = 320.0
occupations = "smearing"
smearing = "mv"
degauss = 0.02
nbnd = 16
nosym = false
noinv = false

# conv_thr：Ry；mixing_beta 为无量纲。
conv_thr = 1e-12

[workflow."3.qe-bands"]
points_per_edge = 20

[stages."3.qe-bands"]
ATOMIC_SPECIES = '''Mg 24.305 Mg.upf
B 10.811 B.upf'''

calculation = "bands"
prefix = "MgB2"

# ecutwfc、ecutrho、degauss：Ry。
ecutwfc = 40.0
ecutrho = 320.0
occupations = "smearing"
smearing = "mv"
degauss = 0.02
nbnd = 16
nosym = true
noinv = true

# conv_thr：Ry；mixing_beta 为无量纲。
conv_thr = 1e-12

[stages."3.qe-bands-post"]
prefix = "MgB2"
lsym = false

[stages."3.qe-dos"]
# degauss：Ry；Emin/Emax/DeltaE：eV。
prefix = "MgB2"
ngauss = 0
degauss = 0.007349864435130998
Emin = -100.0
Emax = 100.0
DeltaE = 0.01

[stages."3.qe-pdos"]
# degauss：Ry；Emin/Emax/DeltaE：eV。
prefix = "MgB2"
ngauss = 0
degauss = 0.007349864435130998
Emin = -100.0
Emax = 100.0
DeltaE = 0.01

[workflow."4.qe-phonon-index"]
phonon_sigma_cm1 = 10.0
points_per_edge = 100

[stages."4.qe-phonon-index"]
prefix = "MgB2"
tr2_ph = 1e-12
ldisp = true
only_init = true
lqdir = true
recover = false
only_wfc = false
fildvscf = "dvscf"
nq1 = 2
nq2 = 2
nq3 = 1

[stages."4.qe-q2r"]
zasr = "simple"

[stages."4.qe-dispersion"]
asr = "simple"
q_in_cryst_coord = true
q_in_band_form = true

[stages."4.qe-phdos"]
asr = "simple"
dos = true
ndos = 200
nk1 = 8
nk2 = 8
nk3 = 4

[stages."4.qe-phonon-index-q"]
prefix = "MgB2"
tr2_ph = 1e-12
ldisp = true
only_init = false
lqdir = true
recover = false
only_wfc = false
fildvscf = "dvscf"
nq1 = 2
nq2 = 2
nq3 = 1

[workflow."5.epw-wannier"]
points_per_edge = 20
fermi_source = "f2"
selection_mode = "fixed_plus_projectability"

[stages."5.wannier90"]
bands_plot = true
bands_num_points = 1
dis_proj_min = 0.01
dis_proj_max = 0.95
dis_froz_proj = true
# 能窗为绝对 eV；conv_tol 为 Å²；num_iter 等为迭代次数。
num_wann = 5
projections = [ "B:pz", "B:px;py", "Mg:s",]
exclude_bands = []
num_iter = 1000
conv_tol = 1e-10
conv_window = 5
dis_win_min = -10.0
dis_win_max = 10.0
dis_froz_min = -2.0
dis_froz_max = 2.0
dis_num_iter = 1000
dis_conv_tol = 1e-10
dis_conv_window = 5

[stages."5.epw-wannier"]
# fsthick/degaussw/wscut/gap_edge：eV；degaussq：meV；eps_acoustic：cm^-1；temps：K。
prefix = "MgB2"
ep_coupling = true
elph = false
etf_mem = 0
nbndsub = 5
iverbosity = 2
amass = [ 24.305, 10.811,]
fsthick = 0.4
degaussw = 0.1
degaussq = 0.5
nqstep = 500
nqsmear = 1
eps_acoustic = 1.0
elecselfen = false
phonselfen = false
a2f = false
ngaussw = 0
efermi_read = true
nk1 = 4
nk2 = 4
nk3 = 2
nq1 = 2
nq2 = 2
nq3 = 1
epwread = false
epwwrite = true
wannierize = true
ephwrite = false
eliashberg = false
band_plot = false
num_iter = 1000

[stages."5.postw90-dos"]
# dos_energy_step、dos_smr_fixed_en_width：eV。
write_hr = false
write_bvec = false
bands_plot = false
dos = true
num_elec_per_state = 2
dos_kmesh = [ 4, 4, 2,]
dos_energy_step = 0.01
dos_adpt_smr = false
dos_smr_fixed_en_width = 0.1
dos_smr_type = "gauss"

[workflow."6.epw-coarse"]
points_per_edge = 20
fermi_source = "f2"

[stages."6.epw-coarse"]
# fsthick/degaussw/wscut/gap_edge：eV；degaussq：meV；eps_acoustic：cm^-1；temps：K。
prefix = "MgB2"
ep_coupling = true
elph = true
etf_mem = 0
nbndsub = 5
iverbosity = 2
amass = [ 24.305, 10.811,]
fsthick = 0.4
degaussw = 0.1
degaussq = 0.5
nqstep = 500
nqsmear = 1
eps_acoustic = 1.0
elecselfen = false
phonselfen = false
a2f = false
ngaussw = 0
efermi_read = true
nk1 = 4
nk2 = 4
nk3 = 2
nq1 = 2
nq2 = 2
nq3 = 1
epwread = false
epwwrite = true
wannierize = false
ephwrite = false
eliashberg = false
band_plot = false
nkf1 = 4
nkf2 = 4
nkf3 = 2
nqf1 = 2
nqf2 = 2
nqf3 = 1

[stages."6.epw-comparison"]
# fsthick/degaussw/wscut/gap_edge：eV；degaussq：meV；eps_acoustic：cm^-1；temps：K。
prefix = "MgB2"
ep_coupling = true
elph = true
etf_mem = 0
nbndsub = 5
iverbosity = 2
amass = [ 24.305, 10.811,]
fsthick = 0.4
degaussw = 0.1
degaussq = 0.5
nqstep = 500
nqsmear = 1
eps_acoustic = 1.0
elecselfen = false
phonselfen = false
a2f = false
ngaussw = 0
efermi_read = true
nk1 = 4
nk2 = 4
nk3 = 2
nq1 = 2
nq2 = 2
nq3 = 1
epwread = true
epwwrite = false
wannierize = false
ephwrite = false
eliashberg = false
band_plot = true
epbread = false
selecqread = true
filkf = "kpoints.dat"
filqf = "qpoints.dat"

[workflow."7.epw-fine"]
fermi_source = "f2"

[stages."7.epw-fine"]
# fsthick/degaussw/wscut/gap_edge：eV；degaussq：meV；eps_acoustic：cm^-1；temps：K。
prefix = "MgB2"
ep_coupling = true
elph = true
etf_mem = 0
nbndsub = 5
iverbosity = 2
amass = [ 24.305, 10.811,]
fsthick = 0.4
degaussw = 0.1
degaussq = 0.5
nqstep = 500
nqsmear = 1
eps_acoustic = 1.0
elecselfen = false
phonselfen = false
a2f = false
ngaussw = 0
efermi_read = true
nk1 = 4
nk2 = 4
nk3 = 2
nq1 = 2
nq2 = 2
nq3 = 1
epwread = true
epwwrite = false
wannierize = false
ephwrite = true
eliashberg = true
liso = false
laniso = false
mp_mesh_k = true
nstemp = 1
temps = [ 5.0,]
nkf1 = 8
nkf2 = 8
nkf3 = 4
nqf1 = 4
nqf2 = 4
nqf3 = 2

[workflow."8.epw-superconductivity"]
task = "tc"
mode = "both"
spectrum_index = 0
initial_gaps = [ 0.001, 0.01,]

[workflow."8.epw-superconductivity".iso]
min_k = 1.0
max_k = 80.0
precision_k = 0.5
max_solves = 64
eigen_margin = 1e-6
normal_gap_mev = 0.0001
super_gap_mev = 0.001

[workflow."8.epw-superconductivity".aniso]
min_k = 1.0
max_k = 80.0
precision_k = 0.5
max_solves = 64
eigen_margin = 1e-6
normal_gap_mev = 0.0001
