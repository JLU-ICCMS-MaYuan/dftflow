# Ubuntu MgB₂ 小网格功能测试；不是数值收敛或 Tc 验收。
# 版本 2：各阶段独立设置；不兼容旧版。
# 科学参数保留原生名称和单位；workflow 独立记录执行设置；自动绑定由程序内部确认。
layout = "numbered"
work_dir = "run"
kpath = "../KPATH.in"
structure = "../../../test_auto/MgB2/MgB2.vasp"
schema_version = 2
outdir = "scratch"

# 电子组合图的纵轴范围，相对费米能级；第 3、5 步共用。
# 修改后只重绘：epw_phonon --stage electronic --plot；epw_wannier --plot。
[plot]
electronic_energy_min_ev = -3.0 # 下限：E_F - 3 eV
electronic_energy_max_ev = 3.0 # 上限：E_F + 3 eV

[pseudos]
Mg = "repair/pp/mg_pbe_v1.4.UPF"
B = "repair/pp/b_pbe_v1.4.uspp.F.UPF"

[programs]
launcher = ["mpirun", "-np", "12"]
environment_script = "/home/mayuan/bin/dftflow-env.sh"

[programs.pw]
path = "/home/mayuan/soft/dftflow-external/bin/pw.x"
args = []

[programs.ph]
path = "/home/mayuan/soft/dftflow-external/bin/ph.x"
args = []

[programs.epw]
path = "/home/mayuan/soft/dftflow-external/bin/epw.x"
args = ["-nk", "12"]


[slurm]
header = """
#SBATCH --partition=local
#SBATCH --nodes=1
#SBATCH --ntasks=12
"""

[budget]
campaign_id = "epic-0007"
# 沿用当前实现要求的 campaign 身份，不表示历史项目预算已重置。
ledger = "campaign/ledger.json"


[stages."1.qe-scf"]
K_POINTS = '''automatic
4 4 2 0 0 0'''
ATOMIC_SPECIES = '''Mg 24.305 mg_pbe_v1.4.UPF
B 10.811 b_pbe_v1.4.uspp.F.UPF'''

calculation = "scf"
prefix = "MgB2"

# ecutwfc、ecutrho、degauss：Ry。
ecutwfc = 40.0
ecutrho = 320.0
occupations = "smearing"
smearing = "mv"
degauss = 0.02

# conv_thr：Ry；mixing_beta 为无量纲。
conv_thr = 1e-10

[stages."2.qe-nscf"]
K_POINTS = [4, 4, 2]
ATOMIC_SPECIES = '''Mg 24.305 mg_pbe_v1.4.UPF
B 10.811 b_pbe_v1.4.uspp.F.UPF'''

calculation = "nscf"
prefix = "MgB2"

# ecutwfc、ecutrho、degauss：Ry。
ecutwfc = 40.0
ecutrho = 320.0
occupations = "smearing"
smearing = "mv"
degauss = 0.02
nbnd = 16
nosym = false
noinv = false

# conv_thr：Ry；mixing_beta 为无量纲。
conv_thr = 1e-12

[workflow."3.qe-bands"]
points_per_edge = 20

[stages."3.qe-bands"]
ATOMIC_SPECIES = '''Mg 24.305 mg_pbe_v1.4.UPF
B 10.811 b_pbe_v1.4.uspp.F.UPF'''

calculation = "bands"
prefix = "MgB2"

# ecutwfc、ecutrho、degauss：Ry。
ecutwfc = 40.0
ecutrho = 320.0
occupations = "smearing"
smearing = "mv"
degauss = 0.02
nbnd = 16
nosym = true
noinv = true

# conv_thr：Ry；mixing_beta 为无量纲。
conv_thr = 1e-12

[stages."3.qe-bands-post"]
prefix = "MgB2"
lsym = false

[stages."3.qe-dos"]
# degauss：Ry；Emin/Emax/DeltaE：eV。
prefix = "MgB2"
ngauss = 0
degauss = 0.007349864435130998
Emin = -100.0
Emax = 100.0
DeltaE = 0.01

[stages."3.qe-pdos"]
# degauss：Ry；Emin/Emax/DeltaE：eV。
prefix = "MgB2"
ngauss = 0
degauss = 0.007349864435130998
Emin = -100.0
Emax = 100.0
DeltaE = 0.01

[workflow."4.qe-phonon-index"]
phonon_sigma_cm1 = 10.0
points_per_edge = 100

[stages."4.qe-phonon-index"]
prefix = "MgB2"
tr2_ph = 1e-12
ldisp = true
only_init = true
lqdir = true
recover = false
only_wfc = false
fildvscf = "dvscf"
nq1 = 2
nq2 = 2
nq3 = 1

[stages."4.qe-q2r"]
zasr = "simple"

[stages."4.qe-dispersion"]
asr = "simple"
q_in_cryst_coord = true
q_in_band_form = true

[stages."4.qe-phdos"]
asr = "simple"
dos = true
ndos = 200
nk1 = 8
nk2 = 8
nk3 = 4

[stages."4.qe-phonon-index-q"]
prefix = "MgB2"
tr2_ph = 1e-12
ldisp = true
only_init = false
lqdir = true
recover = false
only_wfc = false
fildvscf = "dvscf"
nq1 = 2
nq2 = 2
nq3 = 1

[workflow."5.epw-wannier"]
# 高对称路径每段划分为 20 个采样间隔（含两端为 21 点，相邻段共用端点）；
# 用于 QE/Wannier 能带对比，必须与第 3 步及第 6 步的 points_per_edge 一致，不是 NSCF 网格。
points_per_edge = 20
# 使用已绑定的 QE 电子态数据（F2）中的费米能，作为能量参考；
# f2 是来源标识，不是数值 2；当前显式填写的绝对能窗仍以 QE 能量零点为准。
fermi_source = "f2"
# 纯能量选窗：按 dis_win_* 外窗和 dis_froz_* 冻结窗筛选能带，
# 不启用投影度冻结（dis_proj_*）；projections 初始投影仍用于构建 Wannier 函数。
selection_mode = "energy_only"

[stages."5.wannier90"]
bands_plot = true
# 默认首段采样间隔数为 50（含两端为 51 点），可按需调整；其余段由 Wannier90 按段长比例取整。
bands_num_points = 50
# 能窗为绝对 eV；conv_tol 为 Å²；num_iter 等为迭代次数。
num_wann = 5
projections = ["B:pz", "f=0.5,0.0,0.5:s", "f=0.0,0.5,0.5:s", "f=0.5,0.5,0.5:s"]
# Mg 2s/2p 半芯态：原始带编号 1–4；余下 12 带用于 5 个 Wannier 函数。
exclude_bands = [1, 2, 3, 4]
# 四界均为绝对 eV（QE 能量零点），不是相对 E_F。
# Mori 第 19–20 页：8.8 - 7.469822726 = E_F 上方约 1.330177274 eV。
# 当前 NSCF E_F=9.183946302 eV，故冻结上界取 10.51412358 eV。
dis_win_min = -3.40915530
dis_win_max = 26.41812126
dis_froz_min = -3.40915530
dis_froz_max = 10.51412358
num_iter = 1000
conv_tol = 1e-10
conv_window = 5
dis_num_iter = 1000
dis_conv_tol = 1e-10
dis_conv_window = 5

[stages."5.epw-wannier"]
# fsthick/degaussw/wscut/gap_edge：eV；degaussq：meV；eps_acoustic：cm^-1；temps：K。
prefix = "MgB2"
ep_coupling = true
elph = false
etf_mem = 0
nbndsub = 5
iverbosity = 2
amass = [ 24.305, 10.811,]
fsthick = 0.4
degaussw = 0.1
degaussq = 0.5
nqstep = 500
nqsmear = 1
eps_acoustic = 1.0
elecselfen = false
phonselfen = false
a2f = false
ngaussw = 0
efermi_read = true
nk1 = 4
nk2 = 4
nk3 = 2
nq1 = 2
nq2 = 2
nq3 = 1
epwread = false
epwwrite = true
wannierize = true
ephwrite = false
eliashberg = false
band_plot = false
num_iter = 1000

[stages."5.postw90-dos"]
# dos_energy_step、dos_smr_fixed_en_width：eV。
write_hr = false
write_bvec = false
bands_plot = false
dos = true
num_elec_per_state = 2
dos_kmesh = [ 4, 4, 2,]
dos_energy_step = 0.01
dos_adpt_smr = false
dos_smr_fixed_en_width = 0.1
dos_smr_type = "gauss"

[workflow."6.epw-coarse"]
points_per_edge = 20
fermi_source = "f2"
onsite_asr = "gamma_hermitian"

[stages."6.epw-coarse"]
