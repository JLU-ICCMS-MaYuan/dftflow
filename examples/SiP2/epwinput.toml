# SiP₂：schema 2，八个主阶段名与计算目录一致。
# 主段填写主调用的原生参数，其他调用使用用途子段。
# QE 截断能与 degauss 的单位为 Ry；EPW degaussq 为 meV，temps 为 K。
schema_version = 2
work_dir = "/data/home/mayuan/code/dftflow/examples/SiP2"
outdir = "/data/home/mayuan/code/dftflow/examples/SiP2/scratch"
structure = "/data/home/mayuan/code/dftflow/examples/SiP2/POSCAR"
layout = "numbered"
kpath = "/data/home/mayuan/code/dftflow/examples/SiP2/KPATH.in"

[pseudos]
P = "/data/home/mayuan/work/SiP2/data/Pbam/exp_8K_relax_2026-09-29/SiP2_22.2GPa/epw_2x3x6_sugon_amd/pp/p_pbe_v1.5.uspp.F.UPF"
Si = "/data/home/mayuan/work/SiP2/data/Pbam/exp_8K_relax_2026-09-29/SiP2_22.2GPa/epw_2x3x6_sugon_amd/pp/si_pbe_v1.uspp.F.UPF"

[programs]
launcher = [
    "mpirun",
    "-np",
    "36",
]
environment_script = "/data/home/mayuan/intel-2024/oneapi/intel2024_setvars.sh"

[programs.pw]
path = "/data/home/mayuan/soft/qe-7.4.1-amd-oneAPI2024/bin/pw.x"
args = []

[programs.ph]
path = "/data/home/mayuan/soft/qe-7.4.1-amd-oneAPI2024/bin/ph.x"
args = []

[programs.epw]
path = "/data/home/mayuan/soft/qe-7.4.1-amd-oneAPI2024/EPW/src/epw.x"
args = [
    "-nk",
    "36",
]

[programs.wannier90]
path = "/data/home/mayuan/soft/qe-7.4.1-amd-oneAPI2024/bin/wannier90.x"
args = []

[programs.postw90]
path = "/data/home/mayuan/soft/qe-7.4.1-amd-oneAPI2024/bin/postw90.x"
args = []


[slurm]
header = """
#SBATCH --partition=amd7513
#SBATCH --nodes=1
#SBATCH --ntasks=36
"""

[budget]
campaign_id = "epic-0007"
ledger = "/data/home/mayuan/code/dftflow/docs/local/epwflow-campaign.json"

# 第 1 步：QE SCF。SCF 与 NSCF 均使用 2×3×6、零位移网格。
[stages."1.qe-scf"]
calculation = "scf"
prefix = "Si8P16"
ecutwfc = 60.0
ecutrho = 720.0
occupations = "smearing"
smearing = "gaussian"
degauss = 0.02
nr1 = 216
nr2 = 128
nr3 = 60
nr1s = 120
nr2s = 72
nr3s = 32
conv_thr = 0.000000001
mixing_beta = 0.7
electron_maxstep = 200
K_POINTS = """
automatic
2 3 6 0 0 0"""
ATOMIC_SPECIES = """
Si 28.0855 si_pbe_v1.uspp.F.UPF
P 30.973762 p_pbe_v1.5.uspp.F.UPF"""

# 第 2 步：QE NSCF。K_POINTS 只填三个整数，由 Rust 展开完整均匀网格。
[stages."2.qe-nscf"]
calculation = "nscf"
prefix = "Si8P16"
ecutwfc = 60.0
ecutrho = 720.0
occupations = "smearing"
smearing = "gaussian"
degauss = 0.02
nbnd = 96
nosym = true
noinv = true
nr1 = 216
nr2 = 128
nr3 = 60
nr1s = 120
nr2s = 72
nr3s = 32
conv_thr = 0.0000000001
mixing_beta = 0.7
electron_maxstep = 200
K_POINTS = [2, 3, 6]
ATOMIC_SPECIES = """
Si 28.0855 si_pbe_v1.uspp.F.UPF
P 30.973762 p_pbe_v1.5.uspp.F.UPF"""

# 第 3 步：主段为 PW 能带；bands、dos、projwfc 分别配置对应后处理。
[stages."3.qe-electronic"]
calculation = "bands"
prefix = "Si8P16"
ecutwfc = 60.0
ecutrho = 720.0
occupations = "smearing"
smearing = "gaussian"
degauss = 0.02
nbnd = 96
nosym = true
noinv = true
nr1 = 216
nr2 = 128
nr3 = 60
nr1s = 120
nr2s = 72
nr3s = 32
conv_thr = 0.0000000001
mixing_beta = 0.7
electron_maxstep = 200
ATOMIC_SPECIES = """
Si 28.0855 si_pbe_v1.uspp.F.UPF
P 30.973762 p_pbe_v1.5.uspp.F.UPF"""

[stages."3.qe-electronic".bands]
prefix = "Si8P16"
lsym = false

[stages."3.qe-electronic".dos]
prefix = "Si8P16"
ngauss = 0
degauss = 0.007349864435130998
Emin = -100.0
Emax = 100.0
DeltaE = 0.01

[stages."3.qe-electronic".projwfc]
prefix = "Si8P16"
ngauss = 0
degauss = 0.007349864435130998
Emin = -100.0
Emax = 100.0
DeltaE = 0.01

# 第 4 步：保留已有声子的 nosplit 模式及 2×3×6 q 网格。
# q2r、dispersion、dos 分别用于力常数、声子谱和声子 DOS。
[stages."4.qe-phonon-nosplit"]
prefix = "Si8P16"
tr2_ph = 0.000000000001
ldisp = true
only_init = false
lqdir = true
recover = false
only_wfc = false
fildvscf = "dvscf"
nq1 = 2
nq2 = 3
nq3 = 6

[stages."4.qe-phonon-nosplit".q2r]
zasr = "simple"

[stages."4.qe-phonon-nosplit".dispersion]
asr = "simple"
q_in_cryst_coord = true
q_in_band_form = true

[stages."4.qe-phonon-nosplit".dos]
asr = "simple"
dos = true
ndos = 200
nk1 = 8
nk2 = 12
nk3 = 24

# 第 5 步：EPW 主调用及 Wannier90 拟合；postw90 单独用于电子 DOS。
# 本例为 96 个 Wannier 函数，Si/P 的 s,p 投影，迭代上限 500。
[stages."5.epw-wannier"]
prefix = "Si8P16"
ep_coupling = true
elph = false
etf_mem = 1
nbndsub = 96
iverbosity = 2
amass = [28.0855, 30.973762]
fsthick = 1.0
degaussw = 0.1
degaussq = 0.5
nqstep = 500
nqsmear = 1
eps_acoustic = 2.0
elecselfen = false
phonselfen = false
a2f = false
ngaussw = 0
efermi_read = true
nk1 = 2
nk2 = 3
nk3 = 6
nq1 = 2
nq2 = 3
nq3 = 6
epwread = false
epwwrite = true
wannierize = true
ephwrite = false
eliashberg = false
band_plot = false
num_iter = 500 # 与下方 wannier90.num_iter 保持一致

[stages."5.epw-wannier".wannier90]
bands_plot = true
bands_num_points = 50
num_wann = 96
projections = [
    "Si:s,p",
    "P:s,p",
]
exclude_bands = []
num_iter = 500 # 与上方 EPW 主段的 num_iter 保持一致
conv_tol = 0.00000001
conv_window = 5
guiding_centres = true
dis_num_iter = 500
dis_conv_tol = 0.00000001
dis_conv_window = 5

[stages."5.epw-wannier".postw90]
write_hr = false
write_bvec = false
bands_plot = false
dos = true
num_elec_per_state = 2
dos_kmesh = [8, 12, 24]
dos_energy_step = 0.01
dos_adpt_smr = false
dos_smr_fixed_en_width = 0.1
dos_smr_type = "gauss"

# 第 6 步：粗网格 EPC；comparison 为独立的插值比较调用。
[stages."6.epw-coarse"]
prefix = "Si8P16"
ep_coupling = true
elph = true
etf_mem = 1
nbndsub = 96
iverbosity = 2
amass = [28.0855, 30.973762]
fsthick = 1.0
degaussw = 0.1
degaussq = 0.5
nqstep = 500
nqsmear = 1
eps_acoustic = 2.0
elecselfen = false
phonselfen = false
a2f = false
ngaussw = 0
efermi_read = true
nk1 = 2
nk2 = 3
nk3 = 6
nq1 = 2
nq2 = 3
nq3 = 6
epwread = false
epwwrite = true
wannierize = false
ephwrite = false
eliashberg = false
band_plot = false
nkf1 = 2
nkf2 = 3
nkf3 = 6
nqf1 = 2
nqf2 = 3
nqf3 = 6

[stages."6.epw-coarse".q2r]
