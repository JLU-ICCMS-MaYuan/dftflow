[stages."1.qe-scf".pw]
K_POINTS = '''automatic
2 3 6 0 0 0'''
ATOMIC_SPECIES = '''Si 28.0855 si_pbe_v1.uspp.F.UPF
P 30.973762 p_pbe_v1.5.uspp.F.UPF'''

[stages."1.qe-scf".pw.CONTROL]
calculation = "scf"
prefix = "Si8P16"

# FFT 显式沿用历史 SCF/PH：密度 216×128×60，平滑 120×72×32。
[stages."1.qe-scf".pw.SYSTEM]
ecutwfc = 60.0
ecutrho = 720.0
occupations = "smearing"
smearing = "gaussian"
degauss = 0.02
nr1 = 216
nr2 = 128
nr3 = 60
nr1s = 120
nr2s = 72
nr3s = 32

[stages."1.qe-scf".pw.ELECTRONS]
conv_thr = 1e-9
mixing_beta = 0.7
electron_maxstep = 200

[stages."1.qe-scf".workflow.derived]
"pw.CONTROL.outdir" = "当前阶段工作目录和已绑定赝势源"
"pw.CONTROL.pseudo_dir" = "当前阶段工作目录和已绑定赝势源"
"pw.SYSTEM.ibrav" = "已绑定 POSCAR 生成 CELL_PARAMETERS 和 ATOMIC_POSITIONS"
