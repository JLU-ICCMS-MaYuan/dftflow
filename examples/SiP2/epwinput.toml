ATOMIC_SPECIES = '''Si 28.0855 si_pbe_v1.uspp.F.UPF
P 30.973762 p_pbe_v1.5.uspp.F.UPF'''

[stages."2.qe-nscf".pw.CONTROL]
calculation = "nscf"
prefix = "Si8P16"

# 固定为与 SCF 相同的 FFT，避免历史 NSCF 自动选择 216×125×60。
