ecutrho = 720.0
occupations = "smearing"
smearing = "gaussian"
degauss = 0.02
nbnd = 96
nosym = true
noinv = true
nr1 = 216
nr2 = 128
nr3 = 60
nr1s = 120
nr2s = 72
nr3s = 32

[stages."2.qe-nscf".pw.ELECTRONS]
