# 工作流设置：路径、选窗与求解目标；不放入上述原生科学参数段。
[workflow."3.qe-electronic"]
points_per_edge = 20

[workflow."4.qe-phonon-nosplit"]
phonon_sigma_cm1 = 10.0
points_per_edge = 100

[workflow."5.epw-wannier"]
points_per_edge = 20
fermi_source = "f2"
