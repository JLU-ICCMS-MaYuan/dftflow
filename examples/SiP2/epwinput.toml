# 细网格 k=8×12×24、q=4×6×12、μ*=0.1、温度 5/10/20 K 为用户确认的起始值，待收敛验证。
# PW 截断能和展宽单位为 Ry；EPW fsthick/degaussw/wscut/gap_edge 为 eV；degaussq 为 meV；temps 为 K。
# 结构、赝势、粗网格、96 带/96 个 Wannier 函数及 sp3 投影沿用历史输入。
# 费米能从新 NSCF 推导；不沿用旧值。数值迭代/后处理参数采用当前流程起始设置，尚未科学验收。

