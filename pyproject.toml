[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dftflow"
version = "0.2.0"
description = "DFT calculation workflow automation (Rust binaries + mattersim_opt Python CLI)."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
mattersim_opt = "mattersimflow.opt.mattersim_opt:main"

[tool.setuptools]
packages = {find = {where = ["."], include = ["mattersimflow*"]}}
