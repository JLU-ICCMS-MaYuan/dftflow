[package]
name = "qeflow"
version = "0.1.0"
edition = "2021"
description = "Rust rewrite of qeflow: HTC workflow orchestration for QE/VASP as a single static binary"
default-run = "qeflow"

[[bin]]
name = "qeflow"
path = "src/bin/qeflow.rs"

[workspace]
resolver = "2"
members = [
    "crates/qf-config",
    "crates/qf-crystal",
    "crates/qf-input",
    "crates/qf-io",
    "crates/qf-state",
    "crates/qf-runner",
    "crates/qf-phonon",
    "crates/qf-scflow",
]

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
qf-config = { path = "crates/qf-config" }
qf-crystal = { path = "crates/qf-crystal" }
qf-input = { path = "crates/qf-input" }
qf-io = { path = "crates/qf-io" }
qf-state = { path = "crates/qf-state" }
qf-runner = { path = "crates/qf-runner" }
qf-phonon = { path = "crates/qf-phonon" }
qf-scflow = { path = "crates/qf-scflow" }

# Shared dependency versions. Heavy native deps (ndarray-linalg/openblas-static,
# plotters, rayon) are declared here and pulled in by the crates that need them
# (qf-scflow at M4, qf-runner parallel_read at M3).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
ndarray = "0.16"
ndarray-linalg = { version = "0.16", features = ["openblas-static"] }
plotters = "0.3"
rayon = "1"
regex = "1"
anyhow = "1"
thiserror = "1"
