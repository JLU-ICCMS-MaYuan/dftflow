[package]
name = "qeflow"
version = "0.1.0"
edition = "2021"
description = "Rust rewrite of qeflow: HTC workflow orchestration for QE/VASP as a single static binary"
default-run = "qeflow"

[[bin]]
name = "qeflow"
path = "src/bin/qeflow.rs"

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
qf-config = { path = "../crates/qf-config" }
qf-crystal = { path = "../crates/qf-crystal" }
qf-input = { path = "../crates/qf-input" }
qf-io = { path = "../crates/qf-io" }
qf-state = { path = "../crates/qf-state" }
qf-runner = { path = "../crates/qf-runner" }
qf-phonon = { path = "../crates/qf-phonon" }
qf-scflow = { path = "../crates/qf-scflow" }

[dev-dependencies]
qf-compare = { path = "../crates/qf-compare" }
