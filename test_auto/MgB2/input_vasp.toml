# VASP 测试配置（使用新参数名）
potcar_dir = "potcar_lib"
chgcar_path = "vasp_scf/CHGCAR"
wavecar_path = "vasp_scf/WAVECAR"
lobster_executable_path = "/home/mayuan/bin/lobster-5.1.1"

[vasp]
executable_path = "/home/mayuan/soft/vasp.6.3.2/bin/vasp_std"

[slurm]
header = """
#!/bin/bash
#SBATCH --job-name=test
"""

[vasp_scf]
kmesh = 0.04
ENCUT = 520
ISMEAR = 0
SIGMA = 0.05
EDIFF = 1e-6
LREAL = "Auto"
NCORE = 4

[vasp_eband]
kmesh = 0.04
ENCUT = 520
ISMEAR = 0
SIGMA = 0.05
NCORE = 4

[vasp_eledos]
kmesh = 0.04
ENCUT = 520
NCORE = 4

[vasp_fermi]
kmesh = 0.04
ENCUT = 520
ISMEAR = 0
SIGMA = 0.05
NCORE = 4

[vasp_cohp_uniform]
kmesh = 0.04
ENCUT = 520
ISMEAR = -5
ISYM = -1
NCORE = 4

[vasp_cohp_fatband]
scf_kmesh = 0.03
kpath_kmesh = 0.03
kmesh_scheme = "Monkhorst-Pack"
ENCUT = 520
ISMEAR = -5
ISYM = -1
NCORE = 4

[vasp_locpot]
kmesh = 0.04
ENCUT = 520
NGX = 40
NGY = 40
NGZ = 40
NCORE = 4

[vasp_charge]
kmesh = 0.04
ENCUT = 520
EINT = [-5.0, 5.0]
NCORE = 4

[vasp_elf]
kmesh = 0.04
ENCUT = 520
NCORE = 4

[vasp_opt]
kmesh = 0.04
ENCUT = 520
ISMEAR = 0
SIGMA = 0.05
ISYM = 0
SYMPREC = 1e-5
PSTRESS = 0.0
NCORE = 4
NELM = 200
POTIM = 0.05
EDIFF = 1e-6
EDIFFG = -0.01

[vasp_scf_converge]
kmesh = 0.04
ENCUT = [400, 450, 500]
ISMEAR = 0
SIGMA = 0.05
