# VASP 共享基础模板
# 注意：[vasp].executable_path 是完整执行命令，不是可执行文件路径。
potcar_dir = "potcar_lib"
kmesh = 0.04
chgcar_path = "vasp_scf/CHGCAR"
wavecar_path = "vasp_scf/WAVECAR"

[vasp]
executable_path = "mpirun -np 8 /home/mayuan/soft/vasp.6.3.2/bin/vasp_std > vasp.log 2>&1"

[slurm]
header = """
#!/bin/sh
#SBATCH  --job-name=mayuan
#SBATCH  --output=log.out
#SBATCH  --error=log.err
#SBATCH  --partition=liuhanyu
#SBATCH  --nodes=1
#SBATCH  --ntasks=48
#SBATCH  --ntasks-per-node=48
#SBATCH  --cpus-per-task=1
#SBATCH  --exclude=node49,node98,node57

source  ~/intel/oneapi/setvars.sh
ulimit -s unlimited
export I_MPI_ADJUST_REDUCE=3
export MPIR_CVAR_COLL_ALIAS_CHECK=0
"""

[scf_params]
ENCUT = 520
ISMEAR = 0
SIGMA = 0.05
EDIFF = 1e-6
LREAL = "Auto"
NCORE = 4

[eband_params]
ENCUT = 520
ISMEAR = 0
SIGMA = 0.05
NCORE = 4

[eledos_params]
ENCUT = 520
NCORE = 4

[fermisurface_params]
ENCUT = 520
ISMEAR = 0
SIGMA = 0.05
NCORE = 4

[cohp_params]
ENCUT = 520
ISMEAR = -5
ISYM = -1
NCORE = 4

[locpot_params]
ENCUT = 520
NGX = 40
NGY = 40
NGZ = 40
NCORE = 4

[charge_params]
ENCUT = 520
EINT = [-5.0, 5.0]
NCORE = 4

[elf_params]
ENCUT = 520
NCORE = 4

[opt_params]
ENCUT = 520
ISMEAR = 0
SIGMA = 0.05
ISYM = 0
SYMPREC = 1e-5
PSTRESS = 0.0
NCORE = 4
NELM = 200
POTIM = 0.05
EDIFF = 1e-6
EDIFFG = -0.01
