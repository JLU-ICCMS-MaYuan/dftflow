[win]
system_name = "Y1H6"
num_wann = 11
num_bands = 21        # num_bands = nbnd - exclude_bands
exclude_bands = "1:4"
iprint = 1
num_iter = 500
dis_num_iter = 200
dis_froz_min = 5.2
dis_froz_max = 34
dis_win_min = 5.2
dis_win_max = 62.3

# wvfn_formatted = true 用于保存 UKK 文件，便于跨平台数据迁移
wvfn_formatted = false

bands_plot = true
bands_plot_format = "gnuplot"

# wannier_plot = true 表示绘制 Wannier 波函数
wannier_plot = true
# wannier_plot_format 指定绘图输出格式（如 xcrysden）
wannier_plot_format = "xcrysden"

# fermi_energy 可选，若不提供则从 QE 输出中自动提取
fermi_energy = 23.3313
# fermi_surface_plot = true 表示绘制费米面
fermi_surface_plot = true

# dos = true 表示输出 DOS
dos = true
# dos_kmesh 为 DOS 网格 (空格分隔的三个整数)
dos_kmesh = "18 18 18"
# dos_project 为投影到指定 Wannier 轨道
dos_project = "1:11"

[slurm]
header = """
#!/bin/sh
#SBATCH  --job-name=qe_job
#SBATCH  --output=log.out
#SBATCH  --error=log.err
#SBATCH  --partition=liuhanyu
#SBATCH  --nodes=1
#SBATCH  --ntasks=48
#SBATCH  --ntasks-per-node=48
#SBATCH  --cpus-per-task=1

source /work/home/mayuan/intel/oneapi/setvars.sh --force
ulimit -s unlimited
"""

[wannier90]
# 与 qeflow 不同，这里直接填写 wannier90.x 的完整路径或完整命令。
executable_path = "/home/mayuan/soft/qe-7.4.1/external/wannier90/wannier90.x"

[pw2wannier90]
# 与 qeflow 不同，这里直接填写 pw2wannier90.x 的完整路径或完整命令。
executable_path = "/home/mayuan/soft/qe-7.4.1/PP/src/pw2wannier90.x"
input_file = "Y1H6.pw2wan"
prefix = "Y1H6"
outdir = "../qe_nscf/tmp"
seedname = "Y1H6"
# write_unk = true 生成 UNK 文件，供 wannier_plot 使用
write_unk = true

[postw90]
# 与 qeflow 不同，这里直接填写 postw90.x 的完整路径或完整命令。
executable_path = "/home/mayuan/soft/qe-7.4.1/external/wannier90/postw90.x"

[projections]
list = ["Y:d", "H:s"]

[k_points]
mp_grid = [6, 6, 6]
# 可选：若提供显式 kpoints 列表则覆盖 mp_grid 自动生成
# kpoints = [
#   [0.0, 0.0, 0.0],
# ]
# 若需要能带路径，请先在工作目录运行 vaspkit（303）生成 KPATH.in，脚本将自动读取写入 kpoint_path。

[dos]
dos_kmesh = "25 25 25"
dos_energy_min = 5.0
dos_energy_max = 20.0
dos_energy_step = 0.01
dos_project = { Y_d = "1:5", H_p = "6:11" }
